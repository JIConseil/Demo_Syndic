<script>
const $=s=>document.querySelector(s),V3=THREE.Vector3,V2=THREE.Vector2,M4=THREE.Matrix4;

let ents={},meshes=[],byId={},spaces=[],zones=[],defs={},zmem={},zof={},sel=null,zsel=null,tab="s",pc={};
const dec=s=>s.replace(/\\X2\\([0-9A-F]+)\\X0\\/g,(_,h)=>h.match(/.{4}/g).map(x=>String.fromCharCode(parseInt(x,16))).join("")).replace(/\\X\\([0-9A-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
function P(s){let i=0;const n=s.length;

  if(c==="'"){let j=i+1,o="";while(j<n){if(s[j]==="'"){if(s[j+1]==="'"){o+="'";j+=2;continue}break}o+=s[j++]}i=j+1;return dec(o)}
  if(c==="#"){let j=i+1;while(s[j]>="0"&&s[j]<="9")j++;const r=+s.slice(i+1,j);i=j;return{r}}

  if(s[j]==="("){i=j;return{ty:t,a:v()}}
  i=j;return parseFloat(t)}
 return v()}
const A=e=>e.a||(e.a=P("("+e.s+")")),G=x=>x&&x.r?ents[x.r]:null;
const pt=x=>{const e=G(x);return e?A(e)[0]||[0,0,0]:[0,0,0]};
const Vv=a=>new V3(a[0]||0,a[1]||0,a[2]||0);
function ax(x){const e=G(x),M=new M4();if(!e)return M;const a=A(e),o=Vv(pt(a[0]));let z=new V3(0,0,1),xx=new V3(1,0,0);
 if(e.t==="IFCAXIS2PLACEMENT2D"){if(a[1])xx=Vv(pt(a[1]))}else{if(a[1])z=Vv(pt(a[1]));if(a[2])xx=Vv(pt(a[2]))}

function op(x){const e=G(x),M=new M4();if(!e)return M;const a=A(e),s=a[3]||1,X=a[0]?Vv(pt(a[0])).normalize():new V3(1,0,0),Y=a[1]?Vv(pt(a[1])).normalize():new V3(0,1,0),Z=a[4]?Vv(pt(a[4])).normalize():X.clone().cross(Y);
 return M.makeBasis(X.multiplyScalar(s),Y.multiplyScalar(s),Z.multiplyScalar(s)).setPosition(Vv(pt(a[2])))}
function profile(e){if(!e)return null;const a=A(e);let p,m=null;

 const b=p.map(q=>new V3(q.x,q.y,0)),t=b.map(q=>q.clone().add(d));
 THREE.ShapeUtils.triangulateShape(p.map(q=>q.clone()),[]).forEach(([i,j,k])=>o.push(b[i],b[j],b[k],t[i],t[j],t[k]));

  const lp=G(A(b)[0]);if(lp&&lp.t==="IFCPOLYLOOP")o.push(...face(A(lp)[0].map(r=>Vv(pt(r)))))});return o}

    o.push(...face(A(fe)[0].map(i=>Vv(c[(pn?pn[i-1]:i)-1]||[]))))});return o}
  case"IFCTRIANGULATEDFACESET":{const c=A(G(a[0]))[0],pn=a[4],o=[];(a[3]||[]).forEach(t=>t.forEach(i=>o.push(Vv(c[(pn?pn[i-1]:i)-1]||[]))));return o}

/* ---------- 3D ---------- */
const v=$("#v"),ren=new THREE.WebGLRenderer({antialias:true,alpha:true}),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,1e5),root=new THREE.Group();

/* ---------- Chargement ---------- */
const tick=()=>new Promise(r=>setTimeout(r,20));
$("#f").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const msg=$("#msg");msg.style.display="flex";msg.textContent="Lecture du fichier…";await tick();
 try{const txt=new TextDecoder("latin1").decode(await f.arrayBuffer());msg.textContent="Analyse de la structure…";await tick();
  ents={};pc={};const re=/#(\d+)\s*=\s*([A-Z0-9_]+)\s*\(([\s\S]*?)\)\s*;(?=\s*(?:#|ENDSEC|\r?\n|$))/g;let m;while((m=re.exec(txt)))ents[m[1]]={t:m[2],s:m[3],id:+m[1]};

  all.forEach(e=>{if(e.t==="IFCRELDEFINESBYPROPERTIES"){const a=A(e),d=a[5]&&a[5].r;(Array.isArray(a[4])?a[4]:[a[4]]).forEach(r=>r&&r.r&&(defs[r.r]=defs[r.r]||[]).push(d))}
   else if(e.t==="IFCRELASSIGNSTOGROUP"){const a=A(e),g=G(a[6]);if(g&&g.t==="IFCZONE")(a[4]||[]).forEach(r=>{(zmem[g.id]=zmem[g.id]||[]).push(r.r);(zof[r.r]=zof[r.r]||[]).push(g.id)})}});
  spaces=all.filter(e=>e.t==="IFCSPACE");for(const k in zcm)delete zcm[k];zn=0;zones=all.filter(e=>e.t==="IFCZONE");

  const nog=spaces.filter(e=>!byId[e.id]).length;
  if(!meshes.length){msg.style.display="flex";msg.textContent="Aucune géométrie lisible. Les espaces et zones restent consultables dans la liste."}
  else if(nog)toast(nog+" espace(s) sans géométrie lisible");
  tab="s";render()}

function toast(t){const s=$("#sel");s.style.display="block";s.textContent=t}

/* ---------- Interface ---------- */
const nm=e=>{const a=A(e);return[a[2],e.t==="IFCSPACE"?a[7]:a[5]].filter(Boolean).join(" – ")||"(sans nom)"};
const fmt=x=>{if(x==null)return"—";if(Array.isArray(x))return x.map(fmt).join(", ");if(typeof x==="object"&&x.ty){const k=Array.isArray(x.a)?x.a[0]:x.a;return fmt2(k)}return fmt2(x)};

 else{const id=sel,e=id&&ents[id];if(!e){bd.innerHTML='<div class="pad mu">Touchez un espace dans la 3D ou dans la liste.</div>';return}
  const a=A(e);let h=`<div class="pad"><h3>${esc(nm(e))}</h3>
  `;
  
  
  (defs[id]||[]).forEach(r=>{const d=ents[r];if(!d)return;const da=A(d);

   else if(0)h+=`<h4>${esc(da[2])}</h4><table>`+(da[5]||[]).map(G).filter(Boolean).map(p=>{const pa=A(p),u=/AREA/.test(p.t)?" m²":/VOLUME/.test(p.t)?" m³":/LENGTH/.test(p.t)?" m":"";return`<tr><td>${esc(pa[0])}</td><td>${fmt2(pa[3])}${u}</td></tr>`}).join("")+"</table>"});
  bd.innerHTML=h+(/<table>/.test(h)?"":'<div class="mu">Pas de chapitre « 00 - INFO APPART » pour cet espace.</div>')+"</div>"}}
